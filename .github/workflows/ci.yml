name: ci

on:
  push:
    branches: [main]
  pull_request:

# Grant write permissions only to jobs that publish artifacts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # the suite runs against the source tree with no install, so PYTHONPATH is
      # required: a bare `unittest discover` fails to import the package and the
      # root conftest.py only helps pytest
      - name: stdlib-only suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      # a real sdist+wheel build, not just an editable install: this is what the
      # release job uploads, and twine check is what PyPI's own form validator runs
      - name: build and check distribution metadata
        if: matrix.python-version == '3.12'
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: install and smoke against the live process table
        if: matrix.python-version == '3.12'
        run: |
          pip install -e .
          mcp-reaper --help > /dev/null
          mcp-reaper explain > /dev/null 2>&1 || true
          # plan exits 1 when it finds eligible processes, which is a correct
          # answer rather than a failure: assert the JSON, and the code separately
          set +e
          mcp-reaper plan --json > plan.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 1
          python -c "import json; d=json.load(open('plan.json')); assert {'groups','eligible','ambiguous_excluded'} <= set(d), sorted(d)"
